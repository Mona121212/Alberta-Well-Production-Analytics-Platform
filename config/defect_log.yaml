# Project defect log: the single source (DEC-024).
# - docs/defect_log.md: the table is built from this file by scripts/build_defect_log.py; the detail paragraphs are
#   written by hand, and every metric below must appear in the paragraph of its defect (--check).
# - Lakehouse table defect_log: loaded from Files/config/defect_log.yaml by notebooks/load_defect_log.ipynb.
# After a change: python scripts/build_defect_log.py, then
#   fab cp config/defect_log.yaml "well-production-mvp.Workspace/alberta_wells.Lakehouse/Files/config/"
#   and run load_defect_log.
#
# status: Fixed = handled, the issue no longer affects the data; Mitigated = handled, but the issue still exists in
# the source; Open = recorded, not handled. status_map gives the value written to defect_log.status: Mitigated stays
# Mitigated so that the report measure Open Defects (status <> "Closed") still counts it.
# found_date: the date the defect was first recorded in the repo.
# metrics: scope is 12m (2025-07 to 2026-06), a single month (YYYY-MM), 2026-05..2026-06 (the first two months
# loaded), max_month or min_month (the note names the month).

data_scope:
  petrinex_months: 2025-07 to 2026-06
  petrinex_rows: 6481961
  st37_production_string_rows: 658266
  st37_bh_rows: 538629
  statistics_run_id: 024b8cef

status_map:
  Fixed: Closed
  Mitigated: Mitigated
  Open: Open

accepted_values:
  status: [Fixed, Mitigated, Open]
  severity: [high, medium, low]
  area: [ingestion, silver, gold]

