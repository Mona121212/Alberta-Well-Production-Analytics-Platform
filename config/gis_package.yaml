# Client data packages (gis/package.py).

output_root: deliverables
# Buffer around selected wells for the package extent when the selection is a licensee.
extent_buffer_m: 1000

wells_fields: [licence_number, licensee, licence_status, licence_status_group, licence_status_date, spud_date,
               final_drill_date, energy_dev_category, surface_location_dls, township, latitude_nad83, longitude_nad83,
               ground_elevation_m, well_class, inactive_candidate_6m, inactive_candidate_12m, petrinex_evidence,
               last_prod_month, last_activity_month, petrinex_well_keys, oil_m3_12m, gas_e3m3_12m, cond_m3_12m,
               water_m3_12m, years_since_spud, years_in_status, pad_id, pad_wells, qa_pass, n_fail_rules,
               n_warn_rules, n_info_rules, flagged_rules]
pads_fields: [pad_id, wells, wells_in_package, licensees, main_licensee, surface_location_dls, first_spud, last_spud,
              active, spread_m, size_class]
qa_fields: [rule_id, rule_name, severity, layer, record_key, licence_number, detail, metric]

# Known issues copied into every package README (see DECISIONS.md for details).
known_issues:
  - "Well classes are screening definitions for this project, not AER regulatory classifications (DEC-012)."
  - "Inactive candidates use Petrinex production, injection and disposal volumes in the loaded 12 months only; wells that never report to Petrinex by design can appear as candidates (DEC-012, DEC-014)."
  - "Status_Mode/Status_Fluid in ST37 production strings mix numeric codes and text and are not decoded (DEC-011)."
  - "The DLS check uses an approximate township grid; section-level differences under one section are not reliable (DEC-010)."
  - "13 surface holes along the 110 W and 120 W borders lie 110-571 m outside the Statistics Canada boundary (DEC-015)."
  - "Pads are surface holes within 50 m of each other (single linkage); township polygons are convex hulls of wells, not surveyed townships (DEC-016)."
