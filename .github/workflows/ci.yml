# Local checks on every push and pull request (DEC-031). No Fabric credentials and no data files are needed:
# the tests use constructed rows and the committed config/, and the defect log check compares two repo files.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Check the defect log is in sync with config/defect_log.yaml
        run: python scripts/build_defect_log.py --check
